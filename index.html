<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3bot Note</title>
<meta name="description" content="3bot Note — تطبيق ملاحظات عربي تقدمي مع تلخيص آمن بالذكاء الاصطناعي.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3bot Note">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles/main.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="backupBanner"></div>
<div class="app" id="app" data-mobile-view="folders">
  <aside class="folders">
    <div class="toolbar">
      <h2>المجلدات</h2>
      <button class="secondary" id="themeBtn" aria-label="تبديل الوضع الليلي">🌙</button>
    </div>
    <div class="folder-list" id="folderList"></div>
    <div class="folder-actions">
      <div class="row">
        <input class="folder-input" id="newFolderName" placeholder="اسم مجلد جديد" maxlength="80">
        <button id="addFolderBtn" aria-label="إضافة مجلد">📁 إضافة</button>
      </div>
      <button class="secondary mobile-only" data-go="notes">عرض الملاحظات</button>
    </div>
    <div class="trash-panel">
      <button id="trashBtn" aria-label="فتح السلة">🗑️ السلة</button>
    </div>
    <div class="sync-panel">
      <b>المزامنة السحابية:</b><br>
      جاهزة هيكليًا عبر <code>cloud-sync.js</code>. ضع مفاتيح Firebase أو Supabase لتفعيلها.
    </div>
  </aside>

  <section class="notes-panel">
    <div class="toolbar">
      <button class="secondary mobile-only" data-go="folders">المجلدات</button>
      <h2>الملاحظات</h2>
      <button id="newNoteBtn" aria-label="ملاحظة جديدة">＋ جديدة</button>
    </div>
    <div class="search-box">
      <input id="searchInput" placeholder="بحث في العنوان أو النص أو التصنيفات...">
      <div class="filter-row">
        <select id="tagFilter" class="filter-select" style="max-width: 160px; padding: 6px 10px; font-size: 13px;">
          <option value="">كل التصنيفات</option>
        </select>
        <button class="filter-chip" id="pinnedFilter" type="button">⭐ المثبتة فقط</button>
      </div>
    </div>
    <div class="note-list" id="noteList"></div>
  </section>

  <main class="editor" id="editor">
    <div class="editor-top">
      <button class="secondary mobile-only" data-go="notes">الملاحظات</button>
      <button id="pinBtn" class="secondary">⭐ تثبيت</button>
      <button id="summarizeBtn" class="secondary">✨ تلخيص</button>
      <button id="exportJsonBtn" class="secondary">📤 JSON</button>
      <button id="exportMdBtn" class="secondary">📤 Markdown</button>
      <label class="file-label secondary">📥 استيراد JSON<input type="file" id="importJsonInput" accept=".json,application/json"></label>
      <label class="file-label secondary">📥 استيراد MD<input type="file" id="importMdInput" accept=".md,.markdown,text/markdown,text/plain"></label>
      <button id="deleteBtn" class="danger">حذف</button>
    </div>
    <div class="editorBody" id="editorBody">
      <div class="empty">حدد ملاحظة أو أنشئ ملاحظة جديدة.</div>
    </div>
    <section class="ai-summary" id="aiSummary" aria-live="polite" hidden></section>
  </main>
</div>

<script src="cloud-sync.js"></script>
<script type="module" src="src/client/app.js"></script>
</body>
</html>
